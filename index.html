<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 주막 🍶 - 막걸리 & 안주 추천</title>
    <style>
/* 카드 전체를 감싸는 통 */
.flavor-cards-container {
    display: flex;
    justify-content: flex-start; /* 👈 center를 flex-start(왼쪽 정렬)로 변경! */
    gap: 10px; 
    margin-top: 15px; /* 👈 지역 입력칸과 너무 붙지 않게 위쪽 여백 추가 */
    margin-bottom: 20px;
}

/* 카드 1개의 디자인 */
.flavor-card {
    display: flex;
    flex-direction: column; /* 위에서 아래로 배치 (이모지 위, 글씨 아래) */
    align-items: center; /* 가운데 정렬 */
    width: 90px; /* 카드 너비 */
    padding: 15px 5px;
    border: 2px solid #e0e0e0; /* 연한 회색 테두리 */
    border-radius: 12px; /* 둥근 모서리 */
    background-color: white;
    cursor: pointer; /* 마우스 올리면 손가락 모양 */
    transition: all 0.2s ease; /* 부드러운 애니메이션 */
}

/* 마우스 올렸을 때 살짝 위로 뜨는 효과 */
.flavor-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

/* 이모지 크기 키우기 */
.flavor-card .emoji {
    font-size: 35px; 
    margin-bottom: 8px;
}

/* 텍스트 디자인 */
.flavor-card .text {
    font-size: 13px;
    color: #555;
    text-align: center;
    line-height: 1.3;
}

/* 🌟 카드가 선택되었을 때의 디자인 🌟 */
.flavor-card.selected {
    border: 2px solid #8b4513; /* 주막 느낌 짙은 갈색 테두리 */
    background-color: #fff3cd; /* 노란색 배경 */
}

.flavor-card.selected .text {
    font-weight: bold;
    color: #8b4513;
}

body {
    /* 기존에 있던 코드들(예: font-family 등)은 그대로 두시고 아래 내용을 추가/수정해 주세요! */
    
    max-width: 600px; /* 1. 전체 내용이 너무 넓게 퍼지지 않게 가로 길이를 제한합니다. */
    margin: 0 auto;   /* 2. ⭐️핵심⭐️ 양쪽 여백을 똑같이 나눠 가져서 전체를 화면 '가운데'로 보냅니다! */
    padding: 40px 20px; /* 3. 위아래, 양옆으로 숨 쉴 틈(여백)을 줍니다. */
}

/* 1. 입력칸(텍스트 박스) 예쁘게 만들기 */
input[type="text"] {
    width: 100%; /* 가로 길이를 꽉 채워줍니다 */
    padding: 12px; /* 안쪽 여백을 줘서 통통하게 만듭니다 */
    margin-bottom: 15px; /* 아래쪽 요소와 간격을 띄웁니다 */
    border: 1px solid #ddd; /* 테두리를 연한 회색으로 칠합니다 */
    border-radius: 8px; /* 모서리를 둥글게 깎아줍니다 */
    box-sizing: border-box; /* 크기 계산을 딱 맞게 해주는 마법의 코드 */
    font-size: 15px;
}

/* 2. 버튼 예쁘게 만들기 */
button {
    width: 100%; /* 버튼도 가로로 꽉 채워줍니다 */
    padding: 15px;
    background-color: #d97736; /* 주막 느낌이 나는 주황/갈색 톤 */
    color: white; /* 글씨는 흰색 */
    border: none; /* 촌스러운 기본 테두리 없애기 */
    border-radius: 8px; /* 모서리 둥글게 */
    font-size: 16px;
    font-weight: bold; /* 글씨 굵게 */
    cursor: pointer; /* 마우스 올리면 손가락 모양으로 변경 */
    margin-bottom: 30px;
}

/* 버튼에 마우스 올렸을 때 살짝 어두워지는 효과 */
button:hover {
    background-color: #bf6329;
}

/* 1. 제목(h3) 가운데 정렬 추가 */
h3 {
    font-size: 22px; 
    margin-top: 30px;
    margin-bottom: 15px;
    text-align: center; /* 👈 이 마법의 한 줄을 추가해 주세요! */
}

/* 2. 제목 위아래에 있는 설명글(p)도 모두 가운데 정렬 */
p {
    text-align: center; /* 👈 설명글도 가운데로 맞춰줍니다 */
    margin-bottom: 20px;
}

/* 2. 맛 카드 배열 널널하게 펴주기 (기존 .flavor-cards-container가 있다면 이걸로 덮어쓰세요!) */
.flavor-cards-container {
    display: flex;
    justify-content: space-between; /* 양끝을 버튼 너비에 딱 맞게 쫙 펴줍니다 */
    gap: 8px; /* 카드 사이의 간격 */
    margin-bottom: 20px;
}

/* 카드가 5개가 되었으므로, 각각의 카드가 동일한 비율로 예쁘게 줄어들도록 설정 */
.flavor-card {
    flex: 1; /* 5개 카드가 1:1:1:1:1 비율로 공간을 나눠 가짐 */
    padding: 15px 5px; /* 글씨가 안 잘리도록 좌우 여백을 살짝 줄임 */
    /* (나머지 border, border-radius, cursor, text-align 등 기존 코드는 그대로 두세요!) */
}

/* 메인 제목(h1, h2) 가운데 정렬 */
h1, h2 {
    text-align: center;
}

html { scroll-behavior: smooth; }

nav {
    position: sticky;
    top: 0;
    background-color: #fff;
    padding: 15px 0;
    border-bottom: 2px solid #eee;
    display: flex;
    justify-content: center;
    gap: 20px;
    z-index: 100;
}
nav a {
    text-decoration: none;
    color: #8b4513;
    font-weight: bold;
    font-size: 16px;
    }
    nav a:hover { color: #d97736; }

/* 🌟 주막 커스텀 모달 팝업 스타일 🌟 */
#jumak-modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.55);
    z-index: 10000;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(3px);
}

#jumak-modal-box {
    background-color: #fffdfa;
    border: 2px solid #8b4513;
    border-radius: 16px;
    width: 88%;
    max-width: 380px;
    padding: 26px 20px 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    text-align: center;
    box-sizing: border-box;
    animation: modalPopIn 0.25s ease-out;
}

@keyframes modalPopIn {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

#modal-icon {
    font-size: 38px;
    margin-bottom: 8px;
}

#modal-title {
    font-size: 19px;
    color: #8b4513;
    margin: 0 0 10px 0;
    font-weight: bold;
}

#modal-desc {
    font-size: 15px;
    color: #444;
    line-height: 1.5;
    margin: 0 0 20px 0;
    white-space: pre-wrap;
    word-break: keep-all;
}

.modal-btn-row {
    display: flex;
    gap: 10px;
    justify-content: center;
}

.modal-btn {
    flex: 1;
    padding: 12px 10px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 0 !important;
    transition: background-color 0.2s;
}

.modal-btn-primary {
    background-color: #d97736;
    color: white;
}
.modal-btn-primary:hover {
    background-color: #bf6329;
}

.modal-btn-secondary {
    background-color: #eee4d8;
    color: #6b4e3d;
}
.modal-btn-secondary:hover {
    background-color: #dfd1c2;
}
</style>
</head>
<body>
    <!-- 👇 새로 추가하는 네비게이션 바 -->
    <nav>
        <a href="#intro">주막 소개</a>
        <a href="#ai-feature">AI 추천받기</a>
        <a href="#report-form">비밀 장부</a>
    </nav>

    <!-- [섹션 1] 서비스 소개 -->
    <section id="intro">
        <h1>오늘의 주막 🍶</h1>
        <p>오늘 밤, 당신의 취향을 저격할<br>동네 막걸리와 찰떡 안주를 찾아드려요!</p>
    </section>

    <!-- [섹션 2] AI 추천 기능 (입력 및 결과) -->
    <section id="ai-feature">
        <h3>어떤 막걸리를 찾으시나요?</h3>
        
        <!-- 지역 입력칸 -->
        <input type="text" id="region-input" placeholder="예: 서울, 부산, 제주도">
        
        <!-- 맛 선택칸 (앱 스타일 카드형) -->
        <div class="flavor-cards-container">
            <div class="flavor-card" data-value="달달한 맛">
                <div class="emoji">🍯</div>
                <div class="text">달달하고<br>부드러운 맛</div>
            </div>
            <div class="flavor-card" data-value="새콤한 맛">
                <div class="emoji">🍋</div>
                <div class="text">새콤하고<br>산뜻한 맛</div>
            </div>
            <div class="flavor-card" data-value="탄산이 강한 맛">
                <div class="emoji">⚡</div>
                <div class="text">탄산이<br>톡 쏘는 맛</div>
            </div>
            <!-- 👇 3. 문구 수정됨 -->
            <div class="flavor-card" data-value="담백한 맛">
                <div class="emoji">🌰</div>
                <div class="text">담백한 쌀과<br>누룩의 풍미</div>
            </div>
            <!-- 👇 3. 새로운 맛 추가! -->
            <div class="flavor-card" data-value="크리미한 맛">
                <div class="emoji">🍦</div>
                <div class="text">걸쭉하고<br>크리미한 맛</div>
            </div>
        </div>

    <!-- 마법의 숨김 태그 (그대로 유지) -->
    <input type="hidden" id="taste-input" value="달달한 맛">

    
        <!-- 추천 버튼 -->
        <button id="recommend-btn">주모! 추천해 주시오 🛎️</button>

        <!-- 버튼 아래에 이 코드를 추가하세요 -->
        <div id="result-box" style="margin-top: 20px; padding: 15px; background-color: #fff3cd; border-radius: 8px; display: none; white-space: pre-wrap; line-height: 1.6;"></div>
    </section>

    <!-- [섹션 3] 제보하기 폼 -->
    <section id="report-form">
        <h3>나만의 인생 막걸리 제보하기 ✍️</h3>
        <p>AI도 모르는 숨겨진 명주가 있다면 알려주세요!</p>
        <input type="text" id="report-name" placeholder="막걸리 이름 (예: 지평 막걸리)">
        <input type="text" id="report-food" placeholder="어울리는 안주 (예: 해물파전)">
        <button id="report-btn">주모에게 제보하기 📜</button>

        <!-- 👇 비밀 장부 페이지로 이동하는 배너 버튼 -->
        <div style="margin-top: 25px; text-align: center; padding: 20px; background-color: #fdfbf7; border-radius: 12px; border: 1px solid #eee5d8;">
            <h4 style="margin: 0 0 8px 0; color: #8b4513; font-size: 17px;">📖 주모의 비밀 장부</h4>
            <p style="color: #666; font-size: 14px; margin: 0 0 15px 0;">전국의 손님들이 남겨주신 인생 막걸리 & 찰떡 안주 조합을 확인해 보세요!</p>
            <a href="ledger.html" style="display: inline-block; padding: 12px 24px; background-color: #8b4513; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 15px; transition: background 0.2s;">
                📝 비밀 장부 보러가기 →
            </a>
        </div>
    </section>

    <!-- 🍶 주막 커스텀 모달 팝업 HTML -->
    <div id="jumak-modal-overlay">
        <div id="jumak-modal-box">
            <div id="modal-icon">🍶</div>
            <h3 id="modal-title">주모의 알림</h3>
            <p id="modal-desc"></p>
            <div class="modal-btn-row" id="modal-btn-row">
                <!-- 버튼 동적 추가 -->
            </div>
        </div>
    </div>

    <!-- 공통 모달 및 기본 인터랙션 스크립트 -->
<script>
    // 🌟 커스텀 모달 팝업 제어 함수 (브라우저 기본 alert/confirm 대체) 🌟
    function openJumakModal({ icon = '🍶', title = '주모의 알림', message, primaryText = '확인', onPrimary, secondaryText = null, onSecondary }) {
        const overlay = document.getElementById('jumak-modal-overlay');
        document.getElementById('modal-icon').innerText = icon;
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-desc').innerText = message;

        const btnRow = document.getElementById('modal-btn-row');
        btnRow.innerHTML = '';

        if (secondaryText) {
            const secBtn = document.createElement('button');
            secBtn.className = 'modal-btn modal-btn-secondary';
            secBtn.innerText = secondaryText;
            secBtn.onclick = () => {
                overlay.style.display = 'none';
                if (onSecondary) onSecondary();
            };
            btnRow.appendChild(secBtn);
        }

        const primBtn = document.createElement('button');
        primBtn.className = 'modal-btn modal-btn-primary';
        primBtn.innerText = primaryText;
        primBtn.onclick = () => {
            overlay.style.display = 'none';
            if (onPrimary) onPrimary();
        };
        btnRow.appendChild(primBtn);

        overlay.style.display = 'flex';
    }

    // ==========================================
    // 1. 카드형 맛 선택 기능
    // ==========================================
    const cards = document.querySelectorAll('.flavor-card');
    const hiddenInput = document.getElementById('taste-input');

    // 처음 시작할 때 첫 번째 카드(달달한 맛)가 선택되어 있게 만들기
    cards[0].classList.add('selected');
    hiddenInput.value = cards[0].getAttribute('data-value');

    // 각각의 카드를 클릭했을 때 일어날 일 설정
    cards.forEach(card => {
        card.addEventListener('click', function() {
            if (this.classList.contains('selected')) {
                this.classList.remove('selected');
            } else {
                const selectedCount = document.querySelectorAll('.flavor-card.selected').length;
                if (selectedCount >= 3) {
                    openJumakModal({
                        icon: '🍯',
                        title: '맛 선택 안내',
                        message: '아이고 손님! 맛은 최대 3개까지만 고를 수 있소!'
                    });
                    return; 
                }
                this.classList.add('selected');
            }

            const selectedCards = document.querySelectorAll('.flavor-card.selected');
            const selectedValues = Array.from(selectedCards).map(c => c.getAttribute('data-value'));
            hiddenInput.value = selectedValues.join(', ');
        });
    });

    // ==========================================
    // 2. AI 추천 기능
    // ==========================================
    const recommendBtn = document.getElementById('recommend-btn');
    const regionInput = document.getElementById('region-input');
    const tasteSelect = document.getElementById('taste-input'); 
    const resultBox = document.getElementById('result-box');

    recommendBtn.addEventListener('click', function() {
        const region = regionInput.value.trim();
        const taste = tasteSelect.value;

        if (region === "") {
            openJumakModal({
                icon: '🍶',
                title: '지역 입력 안내',
                message: '어느 지역의 막걸리를 찾으시는지 알려주시오!'
            });
            return;
        }

        // 로딩 중 표시하기
        recommendBtn.innerText = "주모가 막걸리 찾는 중... ⏳";
        resultBox.style.display = "block"; 
        resultBox.innerText = "주모가 곰곰이 생각하고 있소. 잠시만 기다려 주시오...";

        // Flask 서버로 데이터 보내기
        fetch('/api/recommend', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ region: region, taste: taste }) 
        })
        .then(response => response.json()) 
        .then(data => {
            resultBox.innerHTML = data.result; 
            recommendBtn.innerText = "주모! 추천해 주시오 🔔"; 
        })
        .catch(error => {
            console.error('Error:', error);
            resultBox.innerText = "아이고, 주막에 불이 났소! (에러 발생)";
            recommendBtn.innerText = "주모! 추천해 주시오 🔔";
        });
    });
</script>

<!-- Firebase Firestore 제보 연동 (타임아웃 + 로컬 백업) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
        getFirestore, 
        collection, 
        addDoc, 
        serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 사용자 Firebase 설정값
    const firebaseConfig = {
      apiKey: "AIzaSyB0QsShgvjWfhYl5uED3FaLIZFUuUMXMuw",
      authDomain: "today-jumak.firebaseapp.com",
      projectId: "today-jumak",
      storageBucket: "today-jumak.firebasestorage.app",
      messagingSenderId: "327900496880",
      appId: "1:327900496880:web:e916ed0bdc6822308ed335"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const reportBtn = document.getElementById('report-btn');
    const reportName = document.getElementById('report-name');
    const reportFood = document.getElementById('report-food');

    reportBtn.addEventListener('click', async function() {
        const name = reportName.value.trim();
        const food = reportFood.value.trim();

        if (name === '' || food === '') {
            openJumakModal({
                icon: '✍️',
                title: '제보 내용 확인',
                message: '아이고 손님! 막걸리 이름과 안주를 모두 적어주시지요!'
            });
            return; 
        }

        reportBtn.disabled = true;
        reportBtn.innerText = '주모가 장부에 기록 중이오... ✍️';

        // 1. 항상 로컬 스토리지에 즉시 안전 저장 (절대 데이터 유실 방지!)
        try {
            const localReports = JSON.parse(localStorage.getItem('jumak_reports') || '[]');
            localReports.unshift({ 
                name: name, 
                food: food, 
                createdAt: new Date().toISOString() 
            });
            localStorage.setItem('jumak_reports', JSON.stringify(localReports));
        } catch (e) {
            console.warn('로컬 저장소 에러:', e);
        }

        // 2. Firebase Firestore 저장 시도 (2.5초 타임아웃 적용하여 무한 대기 방지!)
        const firestorePromise = addDoc(collection(db, "reports"), {
            name: name,
            food: food,
            createdAt: serverTimestamp()
        });

        const timeoutPromise = new Promise((_, reject) => 
            setTimeout(() => reject(new Error('TIMEOUT')), 2500)
        );

        try {
            await Promise.race([firestorePromise, timeoutPromise]);
        } catch (err) {
            console.warn("Firestore 저장 대기 초과 또는 오류 (로컬 저장 유지됨):", err);
        } finally {
            // 3. 버튼 복구 및 입력칸 초기화
            reportBtn.disabled = false;
            reportBtn.innerText = '주모에게 제보하기 📜';
            reportName.value = '';
            reportFood.value = '';

            // 4. 주막 전용 커스텀 모달 팝업 표시 (URL 표시 없이 화면 중앙에 미려하게 렌더링)
            openJumakModal({
                icon: '📜',
